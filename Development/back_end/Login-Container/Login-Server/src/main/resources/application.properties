spring.application.name=Login-Server
spring.datasource.url=jdbc:mysql://172.18.0.5:3306/csrm_db?serverTimezone=UTC
spring.datasource.username=csrm_user
spring.datasource.password=csrm_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.security.user.name=admin
spring.security.user.password={noop}password

server.forward-headers-strategy=framework
server.error.whitelabel.enabled=false
server.error.path=/error
server.port=8080

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

