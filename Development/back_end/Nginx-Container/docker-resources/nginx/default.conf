server {
    if ($host = catopus.education) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	listen 80 default_server;
	listen [::]:80 default_server;

	server_name www.catopus.education catopus.education;
    return 301 https://$host$request_uri;


}
