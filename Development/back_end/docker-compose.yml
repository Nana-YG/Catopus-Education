services:
  csrm-nginx:
    build:
      context: ./Nginx-Container
      dockerfile: Dockerfile
    container_name: csrm-nginx
    depends_on:
      - csrm-login
      - csrm-content
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
    networks:
      - csrm-network

  csrm-login:
    build:
      context: ./Login-Container
      dockerfile: Dockerfile
    container_name: csrm-login
    expose:
      - "8080" # Only expose to internal network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/csrm_db
      - SPRING_DATASOURCE_USERNAME=csrm_user
      - SPRING_DATASOURCE_PASSWORD=csrm_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
    depends_on:
      - database
    networks:
      - csrm-network

  csrm-content:
    build:
      context: ./Content-Container
      dockerfile: Dockerfile
    container_name: csrm-content
    expose:
      - "8081" # Only expose to internal network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/csrm_db
      - SPRING_DATASOURCE_USERNAME=csrm_user
      - SPRING_DATASOURCE_PASSWORD=csrm_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
    depends_on:
      - database
    networks:
      - csrm-network

  database:
    image: mysql:8.0
    container_name: csrm-database
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: csrm_db
      MYSQL_USER: csrm_user
      MYSQL_PASSWORD: csrm_password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - csrm-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  csrm-network:
    driver: bridge

volumes:
  db-data: