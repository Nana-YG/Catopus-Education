services:
  csrm-nginx:
    build:
      context: ./Nginx-Container
      dockerfile: Dockerfile
    container_name: csrm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
    depends_on:
      - csrm-login
      - csrm-content
      - wordpress
    networks:
      - csrm-network

  csrm-login:
    build:
      context: ./Login-Container
      dockerfile: Dockerfile
    container_name: csrm-login
    expose:
      - "8080" # Only expose to internal network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/csrm_db
      - SPRING_DATASOURCE_USERNAME=csrm_user
      - SPRING_DATASOURCE_PASSWORD=csrm_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
    depends_on:
      - database
    networks:
      - csrm-network

  csrm-content:
    build:
      context: ./Content-Container
      dockerfile: Dockerfile
    container_name: csrm-content
    expose:
      - "8081" # Only expose to internal network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/csrm_db
      - SPRING_DATASOURCE_USERNAME=csrm_user
      - SPRING_DATASOURCE_PASSWORD=csrm_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
    depends_on:
      - database
    networks:
      - csrm-network


  # MySQL for WordPress
  wordpress-db:
    image: mysql:5.7
    container_name: wordpress-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_password
    volumes:
      - ./WordPress-DB:/var/lib/mysql
    networks:
      - csrm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WordPress Service
  wordpress:
    image: wordpress:latest
    container_name: wordpress
    expose:
      - "8080"
      - "80"
    restart: always
    depends_on:
      - wordpress-db
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./WordPress-Container/wp-content:/var/www/html
    networks:
      - csrm-network


  database:
    image: mysql:8.0
    container_name: csrm-database
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: csrm_db
      MYSQL_USER: csrm_user
      MYSQL_PASSWORD: csrm_password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - csrm-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  csrm-network:
    driver: bridge

volumes:
  db-data: